syntax = "proto3";

package transaction;

message SaleItem {
    string name = 1;
    int32 qty = 2;
    int32 price = 3;
    int32 sale_price = 4;
}

message TransactionPost {
    int64 id = 1;
    string line_code = 2;
    string cus_code = 3;
    int32 debt = 4;
    int32 paid = 5;
    int32 actual_amount = 6;
    int32 sale_amount = 7;
    repeated SaleItem sales = 8;
}

message PostResponse {
    int64 id = 1;
}

message TransactionList {
    repeated TransactionPost transactions = 1;
}


